name: 更新热点数据

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行（UTC）
  workflow_dispatch:      # 允许手动点按钮立即运行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: 抓取数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py
      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "更新热点数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
